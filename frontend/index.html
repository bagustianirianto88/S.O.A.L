<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.O.A.L – Sistem Otomatisasi Asesmen & Latihan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
    <div class="app-shell">
      <aside class="sidebar panel">
        <h1>S.O.A.L</h1>
        <p class="muted">AI Assessment Studio</p>
        <nav>
          <button class="nav-btn active" data-page="dashboard">Dashboard</button>
          <button class="nav-btn" data-page="generator">Generator Soal</button>
          <button class="nav-btn" data-page="hasil">Hasil</button>
          <button class="nav-btn" data-page="preview">Preview</button>
        </nav>
      </aside>
      <main class="content">
        <section id="dashboard" class="page active panel">
          <h2>Konfigurasi Integrasi</h2>
          <p class="muted">Atur endpoint Vercel dan OpenAI key pribadi Anda.</p>
          <div class="settings-grid">
            <label>URL Backend Vercel<input id="apiBaseInput" type="url" placeholder="https://nama-app.vercel.app" /></label>
            <label>OpenAI API Key (Opsional)<input id="openAiKeyInput" type="password" placeholder="sk-..." autocomplete="off" /></label>
          </div>
          <div class="actions"><button class="btn" id="saveConfigBtn">Simpan</button><button class="btn" id="clearConfigBtn">Reset</button><button class="btn primary" id="testConnectionBtn">Tes Koneksi</button></div>
          <div id="configInfo" class="muted"></div>
          <div class="stats-grid" id="statsGrid"></div>
        </section>

        <section id="generator" class="page panel"><h2>Generator Soal AI</h2><form id="generatorForm" class="form-grid"></form><div id="loading" class="loading hidden"><div class="spinner"></div>AI sedang memproses...</div></section>
        <section id="hasil" class="page panel"><h2>Hasil Soal</h2><div id="resultList"></div></section>
        <section id="preview" class="page panel"><h2>Preview Dokumen</h2><div class="actions"><button class="btn" data-doc="soal">Kertas Soal</button><button class="btn" data-doc="kunci">Kunci Jawaban</button><button class="btn" data-doc="kisi">Kisi-Kisi</button><button class="btn" data-doc="kartu">Kartu Soal</button><button class="btn primary" id="btnPrint">Cetak/PDF</button></div><article id="docPreview" class="doc-preview"></article></section>
      </main>
    </div>
    <script src="./script.js" type="module"></script>
  </body>
</html>
